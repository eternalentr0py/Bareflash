name: Tests

# JVM unit tests (app/src/test). They check pure logic only: parsers, command
# planning, formatting. Nothing here touches a USB device, so a green run says
# nothing about hardware; see docs/RELEASE_CHECKLIST.md for the device matrix.
on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a build-time Python matching chaquopy.defaultConfig.version.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Same NDK and CMake the release build pins, so Gradle configuration
      # behaves identically here.
      - name: Cache NDK and CMake
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: ${{ runner.os }}-ndk-27.2.12479018-cmake-3.22.1

      - name: Install NDK and CMake
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          set -o pipefail
          sdkmanager --install "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Export NDK location
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace -Dorg.gradle.vfs.watch=false

      - name: Keep the test report if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
